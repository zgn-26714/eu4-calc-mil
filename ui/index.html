<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EU4 陆战双向兵员伤害计算器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <h1>EU4 陆战双向兵员伤害计算器</h1>
        <p>双栏独立配置进攻方与防守方，按兵种组、兵种、军科和阶段同时结算双方兵员损失。</p>
      </div>
      <div class="phase-box">
        <label class="field compact">
          <span>阶段</span>
          <select id="phase"></select>
        </label>
        <label class="check">
          <input type="checkbox" id="backrow-artillery">
          <span>后排炮兵半伤</span>
        </label>
      </div>
    </header>

    <section class="shared-strip">
      <label class="field">
        <span>骰子</span>
        <input id="dice" type="number" min="0" max="9" step="1" value="5">
      </label>
      <label class="field">
        <span>将领差额</span>
        <input id="leader-diff" type="number" step="1" value="0">
      </label>
      <label class="field">
        <span>进攻地形惩罚</span>
        <input id="terrain-penalty" type="number" min="0" step="1" value="0">
      </label>
    </section>

    <main class="battle-grid">
      <section class="side-card attacker" id="attacker-card">
        <div class="side-head">
          <h2>进攻方</h2>
          <p>地形惩罚只作用于这一侧。</p>
        </div>
        <div class="panel-grid" id="attacker-fields"></div>
      </section>

      <section class="side-card defender" id="defender-card">
        <div class="side-head">
          <h2>防守方</h2>
          <p>兵种组、军科和兵种选择完全独立。</p>
        </div>
        <div class="panel-grid" id="defender-fields"></div>
      </section>
    </main>

    <section class="actions">
      <button id="calculate">计算双方损失</button>
    </section>

    <section class="results-grid">
      <article class="result-card">
        <span class="result-label">进攻方兵员损失</span>
        <strong id="attacker-loss">0.00</strong>
      </article>
      <article class="result-card">
        <span class="result-label">防守方兵员损失</span>
        <strong id="defender-loss">0.00</strong>
      </article>
    </section>

    <section class="details">
      <div class="details-head">
        <h3>结算详情</h3>
        <p>这里会拆开显示双方的兵种点数、科技修正和战术值。</p>
      </div>
      <pre id="details-output"></pre>
    </section>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
